name: Scan signals

on:
  schedule:
    # Two minutes after each 15m candle close. Higher timeframes are selected in code.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      timeframes:
        description: "due, all, or one of 15m 30m 1h 4h 12h 1d 3d 1w 1M"
        required: false
        default: due
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shrieken-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.scan.outputs.deploy }}
      failed: ${{ steps.scan.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require SITE_PASSWORD
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "${SITE_PASSWORD}" ]; then
            echo "::error title=SITE_PASSWORD missing::Add a repository secret named SITE_PASSWORD under Settings → Secrets and variables → Actions. This workflow will not publish unencrypted signals."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python3 -m unittest discover -s tests -p test_logic.py -v

      - name: Scan and encrypt
        id: scan
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.timeframes || 'due' }}
        run: python3 scanner/ci_scan.py

      - name: Configure GitHub Pages
        id: pages
        if: steps.scan.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages must be switched on
        if: steps.scan.outputs.deploy == 'true' && steps.pages.outcome != 'success'
        run: |
          echo "::error title=Turn on GitHub Pages::Actions could not turn GitHub Pages on by itself. On GitHub open Settings, then Pages, then Build and deployment, and set Source to GitHub Actions. Then open the Actions tab and re-run this workflow."
          exit 1

      - name: Upload site
        if: steps.scan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Save encrypted data for the next run
        if: steps.scan.outputs.deploy == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -d dist/data
          rm -rf /tmp/site-data-stage
          mkdir -p /tmp/site-data-stage
          cp -a dist/data /tmp/site-data-stage/data
          git checkout --orphan site-data-rebuild
          git reset --quiet
          mkdir -p data
          cp -a /tmp/site-data-stage/data/. data/
          printf '%s\n' 'Encrypted scan cache. Signal files are ciphertext, not plaintext.' > README.md
          git add data README.md
          git -c user.name="Shrieken Scanner" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Encrypted scan data"
          git push --force origin HEAD:site-data

  deploy:
    needs: scan
    if: needs.scan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  result:
    needs: [scan, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report incomplete scan
        if: needs.scan.result != 'success' || needs.scan.outputs.failed == '1' || (needs.scan.outputs.deploy == 'true' && needs.deploy.result != 'success')
        run: |
          echo "::error::The scan or the Pages deploy did not fully succeed. Successful timeframes are still published when the deploy itself succeeded."
          exit 1
